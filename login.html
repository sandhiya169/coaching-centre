<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Login | Stackly Coaching Centre</title>
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth-body">
<div class="auth">
  <aside class="auth-art">
    <div class="arch"><img src="assets/images/image-12.webp" alt="Students studying together in a coaching class"></div>
    <p class="q">Batches of 15, a test every Saturday and a mentor who notices you.</p>
  </aside>
  <div class="auth-main">
    <div class="auth-top"><a href="index.html" class="logo"><img src="assets/images/stackly.webp" alt="Stackly"></a><a href="index.html" class="back"><i class="fas fa-arrow-left"></i> Back to home</a></div>
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="sub">Log in to see classes, tests and fees.</p>
      <p class="okmsg" id="ok" role="status" hidden>Account created. Please log in.</p>
      <div class="tabs" role="group" aria-label="Login as">
        <button type="button" data-role="student" aria-pressed="true"><i class="fas fa-user-graduate"></i> Student</button>
        <button type="button" data-role="admin" aria-pressed="false"><i class="fas fa-user-shield"></i> Admin</button>
      </div>
      <p class="hint" id="hint">For students and parents checking classes, tests and fees.</p>
      <form id="login" novalidate>
        <label>Email address<input name="email" type="email" autocomplete="email" data-rule="email" aria-describedby="e-email" placeholder="you@example.com"></label>
        <small class="err" id="e-email"></small>
        <label>Password
          <span class="pw"><input name="password" type="password" autocomplete="current-password" data-rule="loginpw" aria-describedby="e-password"><button type="button" class="eye" data-eye aria-label="Show password"><i class="fas fa-eye"></i></button></span>
        </label>
        <small class="err" id="e-password"></small>
        <a href="404.html" class="forgot">Forgot password?</a>
        <button class="btn" type="submit" id="sub-btn">Log in as student <i class="fas fa-right-to-bracket"></i></button>
      </form>
      <p class="or"><span>or continue with</span></p>
      <div class="social">
        <button type="button" class="btn btn-ghost" data-social="google"><i class="fab fa-google"></i> Sign in with Google</button>
        <button type="button" class="btn btn-ghost" data-social="facebook"><i class="fab fa-facebook-f"></i>Sign in with Facebook</button>
      </div>
      <p class="swap">New to Stackly? <a href="signup.html">Create an account</a></p>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
